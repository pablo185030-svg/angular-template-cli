# Complete server{} block, meant to be placed at /etc/nginx/conf.d/default.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # Proxy the backend API. Replace the upstream with your real API.
    # location /api/ {
    #     proxy_pass http://your-api:8080/;
    # }

    # Hashed assets are cacheable for a long time.
    location ~* \.(?:js|css|svg|ico|png|jpg|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
