<section class="products-list-page" data-testid="products-list-page">
  <header class="products-list-page__header">
    <h1 class="products-list-page__title">Products</h1>
    <a mat-flat-button routerLink="/products/new" data-testid="new-product">New product</a>
  </header>

  @if (error()) {
    <p class="products-list-page__error" role="alert" data-testid="products-error">
      {{ error() }}
    </p>
  }

  @if (loading()) {
    <p data-testid="products-loading">Loading…</p>
  } @else if (items().length === 0 && !error()) {
    <p data-testid="products-empty">There are no products yet.</p>
  } @else if (items().length > 0) {
    <table
      mat-table
      [dataSource]="items()"
      class="products-list-page__table"
      data-testid="products-table"
    >
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let product">{{ product.name }}</td>
      </ng-container>
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Price</th>
        <td mat-cell *matCellDef="let product">{{ product.price | currency }}</td>
      </ng-container>
      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef>Stock</th>
        <td mat-cell *matCellDef="let product">{{ product.stock }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          <span class="products-list-page__sr">Actions</span>
        </th>
        <td mat-cell *matCellDef="let product" class="products-list-page__actions">
          <a
            mat-button
            [routerLink]="['/products', product.id, 'edit']"
            [attr.data-testid]="'edit-product-' + product.id"
            [attr.aria-label]="'Edit ' + product.name"
            >Edit</a
          >
          <button
            mat-button
            type="button"
            [attr.data-testid]="'delete-product-' + product.id"
            [attr.aria-label]="'Delete ' + product.name"
            (click)="confirmDelete(product)"
          >
            Delete
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns" data-testid="product-row"></tr>
    </table>
  }
</section>
