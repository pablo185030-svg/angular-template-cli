<h2 mat-dialog-title data-testid="confirm-title">{{ data.title }}</h2>
<mat-dialog-content data-testid="confirm-message">{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false" data-testid="confirm-cancel">
    Cancel
  </button>
  <button mat-flat-button type="button" [mat-dialog-close]="true" data-testid="confirm-accept">
    {{ data.confirmLabel ?? 'Confirm' }}
  </button>
</mat-dialog-actions>
