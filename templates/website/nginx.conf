# Optional reverse proxy in front of the SSR container. It serves the built static assets from
# disk (mount dist/coto-angular-template/browser at /usr/share/nginx/html) and proxies every
# other request to the Node SSR server. This file is a complete server{} block, meant to be
# placed at /etc/nginx/conf.d/default.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Baseline security headers. nginx does not inherit add_header into a location that declares its
    # own add_header, so the locations below repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Health endpoint answered by nginx, so monitoring never triggers a server-side render.
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # Build output files carry a content hash in their name, so they are cached for a year.
    location ~* "-[A-Za-z0-9_-]{8}\.(?:js|css|mjs)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri @ssr;
    }

    # Other files that exist on disk (robots.txt, sitemap.xml, llms.txt, the favicon...) are served
    # directly by nginx and revalidated. Everything else goes to the Node server.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri @ssr;
    }

    location @ssr {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
